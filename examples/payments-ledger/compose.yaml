name: likego-payments-ledger

services:
  postgres:
    image: docker.io/library/postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD: local-e2e-only
      POSTGRES_USER: likego
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U likego -d ledger"]
      interval: 1s
      timeout: 3s
      retries: 30

  nats:
    image: docker.io/library/nats:2.14.3-alpine@sha256:c11af972c99ae542de8925e6a7d9c533aa1eb039660420d2074beed6089b3bf0
    command: ["-js", "-sd", "/data"]
    ports:
      - "127.0.0.1:34222:4222"
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  nats-data:
