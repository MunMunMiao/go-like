.fig-num span{color:#445163;font-size:.86rem}
.fig-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig-wrap svg{display:block;width:100%;height:auto;min-width:980px}
.fig-cap{color:#6b7889;font-size:.86rem;margin:10px 4px 2px;max-width:none}
text{fill:#121a24;font-family:"Inter","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.panel{fill:#e8ecf1;stroke:#b9c3cf;stroke-width:1.5}
.screw{fill:#dde3ea;stroke:#b9c3cf}
