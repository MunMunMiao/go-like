<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-label="App 生命周期三层：遥测层最先接纳、最后排空；资源层按声明顺序逐个启动并等待可用，倒序停止；服务层并发启动与停止。" class="fig"><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#121a24}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:26px 0 10px}
.fig-num{background:#ffffff;border:1px solid #d3dae3;border-radius:10px;padding:14px 16px}
