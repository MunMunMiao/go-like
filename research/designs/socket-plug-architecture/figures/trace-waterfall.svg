.port-note,.col-head,.panel-meta,.plug-lib,.fig-note,.annot,.wf-note,.slot-field,.k-desc,.u-item{fill:#445163}
.jack{fill:#ffffff;stroke:#2a78d6;stroke-width:2}
.jack-pin{fill:#2a78d6}
