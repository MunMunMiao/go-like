.ready-line{fill:none;stroke:#008300;stroke-width:2}
.budget{stroke:#445163;stroke-width:1.5;stroke-dasharray:4 3}
.flow{fill:none;stroke:#6b7889;stroke-width:1.4}
.arrowhead{fill:#6b7889}
