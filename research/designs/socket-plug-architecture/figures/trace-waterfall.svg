<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 496" role="img" aria-label="一条链路跨越 Web 请求、RPC 调用、消息投递和后台任务；另有三个根单元：定时任务、配置重载、应用停止。" class="fig"><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#121a24}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:26px 0 10px}
.fig-num{background:#ffffff;border:1px solid #d3dae3;border-radius:10px;padding:14px 16px}
