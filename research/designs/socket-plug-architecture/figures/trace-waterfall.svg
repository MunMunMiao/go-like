.prong{fill:#eb6834}
.plug-name{fill:#121a24}
.cable{fill:none;stroke:#eb6834;stroke-width:2;opacity:.6;transition:opacity .15s,stroke-width .15s}
.cable-thin{fill:none;stroke:#eb6834;stroke-width:1.5;opacity:.6}
.lane-line{stroke:#d3dae3}
.lane-label,.phase-label,.fig-title,.slot-title,.u-title,.k-name{fill:#121a24}
.phase-start{fill:#2a78d6;opacity:.06}
.phase-run{fill:#1baf7a;opacity:.07}
.phase-stop{fill:#eb6834;opacity:.06}
.bar-tel{fill:#6250d6}
