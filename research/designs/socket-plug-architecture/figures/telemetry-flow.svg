<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-label="观测数据流：core 拥有的工作单元和业务代码通过单一 Context 槽找到已安装的提供者，再由 otel、pino、winston、prometheus 插头导出；没有安装时为空操作。" class="fig"><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#121a24}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:26px 0 10px}
.fig-num{background:#ffffff;border:1px solid #d3dae3;border-radius:10px;padding:14px 16px}
.fig-num b{display:block;font-family:"Chakra Petch","Noto Sans SC",system-ui,sans-serif;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.fig-num span{color:#445163;font-size:.86rem}
.fig-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig-wrap svg{display:block;width:100%;height:auto;min-width:980px}
.fig-cap{color:#6b7889;font-size:.86rem;margin:10px 4px 2px;max-width:none}
