xt x="34.0" y="368.0" class="u-item mono" text-anchor="start" font-size="11">log.info(ctx, msg, attrs)</text><text x="34.0" y="386.0" class="u-item mono" text-anchor="start" font-size="11">counter.add(ctx, 1, attrs)</text><rect x="400" y="60" width="300" height="182" rx="10" class="slot-box"/><text x="416.0" y="84.0" class="slot-title" text-anchor="start" font-size="13" font-weight="600">Context 里唯一的观测槽</text><text x="416.0" y="108.0" class="slot-field mono" text-anchor="start" font-size="11">tracer · meters[] · handlers[]</text><text x="416.0" y="129.0" class="slot-field mono" text-anchor="start" font-size="11">propagator</text><text x="416.0" y="150.0" class="slot-field mono" text-anchor="start" font-size="11">span（当前活动 span）</text><text x="416.0" y="171.0" class="slot-field mono" text-anchor="start" font-size="11">resource（service.* 属性）</text><text x="416.0" y="192.0" class="slot-field mono" text-anchor="start" font-size="11">operation（所在单元名）</text><text x="416.0" y="213.0" class="slot-field mono" text-anchor="start" font-size="11">observing = 是否安装了任一信号</text><rect x="400" y="262" width="300" height="132" rx="10" class="machine-box"/><text x="416.0" y="286.0" class="slot-title" text-anchor="start" font-size="13" font-weight="600">core 埋点机（每个单元一次）</text><text x="416.0" y="310.0" class="slot-field" text-anchor="start" font-size="11.5">1 查一次槽；未安装 → 直接执行</text><text x="416.0" y="330.0" class="slot-field" text-anchor="start" font-size="11.5">2 从载体 extract 父上下文</text><text x="416.0" y="350.0" class="slot-field" text-anchor="start" font-size="11.5">3 startSpan + enter(ctx, fn)</text><text x="416.0" y="370.0" class="slot-field" text-anchor="start" font-size="11.5">4 结束：状态、指标、完成日志</text><rect x="400" y="420" width="300" height="96" rx="10" class="prop-box"/><text x="416.0" y="444.0" class="slot-title" text-anchor="start" font-size="13" font-weight="600">传播（默认 W3C traceparent）</text><text x="416.0" y="466.0" class="slot-field" text-anchor="start" font-size="11.5">HTTP 请求头 · 消息 headers</text><text x="416.0" y="486.0" class="slot-field mono" text-anchor="start" font-size="11">BullMQ telemetry.metadata</text><text x="416.0" y="506.0" class="slot-field" text-anchor="start" font-size="11.5">未装 tracer 也照常传播，日志可关联</text><path d="M320 67 C360 67 360 330 400 330" class="flow" marker-end="url(#arr)"/><path d="M320 147 C360 147 360 330 400 330" class="flow" marker-end="url(#arr)"/><path d="M320 245 C360 245 360 330 400 330" class="flow" marker-end="url(#arr)"/><path d="M320 352 C360 352 360 330 400 330" class="flow" marker-end="url(#arr)"/><path d="M550.0 242 V262" class="flow" marker-end="url(#arr)"/><rect x="770" y="70" width="206" height="64" rx="8" class="k-box k-trace"/><circle cx="770" cy="102" r="6" class="jack"/><text x="786.0" y="96.0" class="k-name mono" text-anchor="start" font-size="12" font-weight="600">TracerProvider</text><text x="786.0" y="116.0" class="k-desc mono" text-anchor="start" font-size="10.5">startSpan · enter?</text><path d="M700 330 C740 330 730 102 763 102" class="flow" marker-end="url(#arr)"/><rect x="770" y="190" width="206" height="64" rx="8" class="k-box k-metric"/><circle cx="770" cy="222" r="6" class="jack"/><text x="786.0" y="216.0" class="k-name mono" text-anchor="start" font-size="12" font-weight="600">MeterProvider[]</text><text x="786.0" y="236.0" class="k-desc mono" text-anchor="start" font-size="10.5">instrument → record</text><path d="M700 330 C740 330 730 222 763 222" class="flow" marker-end="url(#arr)"/><rect x="770" y="310" width="206" height="64" rx="8" class="k-box k-log"/><circle cx="770" cy="342" r="6" class="jack"/><text x="786.0" y="336.0" class="k-name mono" text-anchor="start" font-size="12" font-weight="600">LogHandler[]</text><text x="786.0" y="356.0" class="k-desc mono" text-anchor="start" font-size="10.5">enabled · handle · withAttrs?</text><path d="M700 330 C740 330 730 342 763 342" class="flow" marker-end="url(#arr)"/><rect x="770" y="430" width="206" height="64" rx="8" class="k-box k-prop"/><circle cx="770" cy="462" r="6" class="jack"/><text x="786.0" y="456.0" class="k-name mono" text-anchor="start" font-size="12" font-weight="600">Propagator</text><text x="786.0" y="476.0" class="k-desc mono" text-anchor="start" font-size="10.5">inject · extract · fields</text><path d="M700 330 C740 330 730 462 763 462" class="flow" marker-end="url(#arr)"/><text x="1012.0" y="52.0" class="col-head" text-anchor="start" font-size="11">插头 / 内置实现</text><rect x="1012" y="70" width="156" height="52" rx="8" class="plug-box"/><text x="1022.0" y="91.0" class="plug-name mono" text-anchor="start" font-size="11.5" font-weight="600">otel</text><text x="1022.0" y="109.0" class="plug-lib" text-anchor="start" font-size="10.5">OTLP 导出（三信号）</text><rect x="1012" y="190" width="156" height="52" rx="8" class="plug-box"/><text x="1022.0" y="211.0" class="plug-name mono" text-anchor="start" font-size="11.5" font-weight="600">prometheus/metric</text><text x="1022.0" y="229.0" class="plug-lib" text-anchor="start" font-size="10.5">/metrics 抓取</text><rect x="1012" y="290" width="156" height="52" rx="8" class="plug-box"/><text x="1022.0" y="311.0" class="plug-name mono" text-anchor="start" font-size="11.5" font-weight="600">pino/log</text><text x="1022.0" y="329.0" class="plug-lib" text-anchor="start" font-size="10.5">stdout · 文件</text><rect x="1012" y="350" width="156" height="52" rx="8" class="plug-box"/><text x="1022.0" y="371.0" class="plug-name mono" text-anchor="start" font-size="11.5" font-weight="600">winston/log</text><text x="1022.0" y="389.0" class="plug-lib" text-anchor="start" font-size="10.5">transports</text><rect x="1012" y="430" width="156" height="52" rx="8" class="plug-box"/><text x="1022.0" y="451.0" class="plug-name mono" text-anchor="start" font-size="11.5" font-weight="600">core 内置</text><text x="1022.0" y="469.0" class="plug-lib" text-anchor="start" font-size="10.5">W3C · 记录器 · 空操作</text><path d="M976 102 C1006 102 982 96 1012 96" class="cable-thin"/><path d="M976 222 C1006 222 982 216 1012 216" class="cable-thin"/><path d="M976 342 C1006 342 982 316 1012 316" class="cable-thin"/><path d="M976 342 C1006 342 982 376 1012 376" class="cable-thin"/><path d="M976 462 C1006 462 982 456 1012 456" class="cable-thin"/><path d="M976 222 C1006 222 982 96 1012 96" class="cable-thin"/><path d="M976 342 C1006 342 982 96 1012 96" class="cable-thin"/><text x="20.0" y="546.0" class="fig-note" text-anchor="start" font-size="12">插头只实现右侧四个插座，不包装任何调用点；埋点位置全部在 core 里，任务、消息、生命周期、配置与注册中心也在其中。</text></svg>