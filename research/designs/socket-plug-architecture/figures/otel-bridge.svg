<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" role="img" aria-label="显式 Context 与 OTel AsyncLocalStorage 的桥接：core 在用户代码外调用 enter，让第三方 span 嵌套在 go-like span 下；在 Server.start 和常驻循环外调用 enterRoot，避免捕获过期 span。" class="fig"><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#121a24}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
