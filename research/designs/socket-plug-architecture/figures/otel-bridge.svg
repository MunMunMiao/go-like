.mig-t-plug{fill:#b0441a}</style><rect width="100%" height="100%" fill="#f2f4f7"/><defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrowhead"/></marker></defs><rect x="20" y="24" width="360" height="190" rx="10" class="bridge-box"/><text x="38.0" y="54.0" class="slot-title" text-anchor="start" font-size="14" font-weight="600">显式优先</text><text x="38.0" y="86.0" class="slot-field" text-anchor="start" font-size="12">ctx 里的 span 永远胜出</text><text x="38.0" y="110.0" class="slot-field" text-anchor="start" font-size="12">OTel context.active() 只在</text><text x="38.0" y="134.0" class="slot-field" text-anchor="start" font-size="12">ctx 无 span 且 implicitParent:true 时被读取</text><text x="38.0" y="158.0" class="slot-field" text-anchor="start" font-size="12">默认 implicitParent:false</text><rect x="410" y="24" width="360" height="190" rx="10" class="bridge-box"/><text x="428.0" y="54.0" class="slot-title" text-anchor="start" font-size="14" font-weight="600">enter：让第三方嵌套进来</text><text x="428.0" y="86.0" class="slot-field" text-anchor="start" font-size="12">core 用 TracerProvider.enter(unitCtx, fn)</text><text x="428.0" y="110.0" class="slot-field" text-anchor="start" font-size="12">包住处理器、中间件、每次流式拉取、</text><text x="428.0" y="134.0" class="slot-field" text-anchor="start" font-size="12">整个客户端调用（含每次 fetch）</text><text x="428.0" y="158.0" class="slot-field" text-anchor="start" font-size="12">→ undici / pg / ioredis 的 span 成为子 span</text><rect x="800" y="24" width="360" height="190" rx="10" class="bridge-box"/><text x="818.0" y="54.0" class="slot-title" text-anchor="start" font-size="14" font-weight="600">enterRoot：不捕获过期 span</text><text x="818.0" y="86.0" class="slot-field" text-anchor="start" font-size="12">Server.start、资源启动、Telemetry.start、</text><text x="818.0" y="110.0" class="slot-field" text-anchor="start" font-size="12">常驻循环外层用 enterRoot</text><text x="818.0" y="134.0" class="slot-field" text-anchor="start" font-size="12">→ OTel ALS 被设为 ROOT_CONTEXT</text><text x="818.0" y="158.0" class="slot-field" text-anchor="start" font-size="12">监听器和定时器捕获不到请求或启动 span</text><path d="M380 120 H408" class="flow" marker-end="url(#arr2)"/><path d="M770 120 H798" class="flow" marker-end="url(#arr2)"/><text x="20.0" y="250.0" class="fig-note" text-anchor="start" font-size="12.5">根单元规则 R7：cron tick、config reload、app start/stop，以及没有有效远端父 span 的入站单元，一律 root:true。</text><text x="20.0" y="274.0" class="fig-note" text-anchor="start" font-size="12.5">设计评审用实验复现过：读取隐式上下文作为默认父 span 的方案，会把新任务挂到已经结束的 span 下。</text></svg>