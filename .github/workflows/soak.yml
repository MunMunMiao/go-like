name: Production soak

on:
  workflow_dispatch:
  schedule:
    - cron: "29 2 * * 0"

permissions:
  contents: read

concurrency:
  group: production-soak
  cancel-in-progress: false

jobs:
  soak:
    name: 60 minute HTTP and provider soak
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production soak
        run: bun run soak:http

      - name: Verify persisted evidence
        run: bun run soak:check

      - name: Upload soak evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: likego-production-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/soak/
          if-no-files-found: error
          retention-days: 30
