name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0

      - name: Set up npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git branch --set-upstream-to=origin/main main
          bun scripts/release-preflight.cli.ts
          bun run verify

      - name: Publish with npm trusted publishing and provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run changeset publish

      - name: Reconcile and push release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run changeset tag
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git push origin --follow-tags

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: likego-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
