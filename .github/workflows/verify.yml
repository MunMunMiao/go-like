name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Bun 1.3.14 / Node 26.5.0 / Deno 2.9.4
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require changeset for public package changes
        if: github.event_name == 'pull_request'
        env:
          LIKEGO_CHANGESET_BASE: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/changeset-required.cli.ts --base "$LIKEGO_CHANGESET_BASE"

      - name: Verify repository
        run: bun run verify

      - name: Upload gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: likego-gate-evidence-${{ github.run_id }}
          path: .artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
